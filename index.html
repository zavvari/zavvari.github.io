
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TiniMana | Creative Studio</title>

<style>

body {

  background: #111315;

}
header {
  padding: 30px 7%;

}

  font-size: 20px;

  letter-spacing: 4px;
}

  color: #b7a18a;

}

  padding: 12vh 7%;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.eyebrow {
  color: #c8aa88;

  font-size: clamp(52px, 9vw, 120px);

p {

  line-height: 1.8;
  max-width: 550px;
